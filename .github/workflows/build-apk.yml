name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug + release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
        env:
          ALEXA_KEYSTORE: ${{ secrets.ALEXA_KEYSTORE_PATH }}
          ALEXA_KEYSTORE_PASSWORD: ${{ secrets.ALEXA_KEYSTORE_PASSWORD }}
          ALEXA_KEY_ALIAS: ${{ secrets.ALEXA_KEY_ALIAS }}
          ALEXA_KEY_PASSWORD: ${{ secrets.ALEXA_KEY_PASSWORD }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: alexa-player-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
