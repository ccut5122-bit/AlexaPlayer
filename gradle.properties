# JVM
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Chaquopy runs a host Python process at configuration time, which Gradle's configuration
# cache rejects. Caching the task graph is a few seconds here anyway.
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
# The androidx versions this app targets are compiled against API 37.
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
